<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>สั่งซื้อสินค้า — Body Scent</title>
  <meta name="description" content="กรอกข้อมูลเพื่อสั่งซื้อน้ำหอมฉีดตัวและโรลออน Body Scent">
  <link rel="stylesheet" href="style.css">
  <style>
    /* เฉพาะหน้าสั่งซื้อ */
    .order-form {
      max-width: 36rem;
    }
    .field {
      margin-bottom: var(--space-4);
    }
    .field label {
      display: block;
      margin-bottom: 0.25rem;
      font-size: var(--fs-sm);
      color: var(--beige-deep);
    }
    .field .req {
      color: var(--bronze-deep);
    }
    .field textarea {
      resize: vertical;
      line-height: 1.7;
    }
    .field__hint {
      margin: 0.5rem 0 0;
      font-size: var(--fs-xs);
      color: var(--beige-deep);
    }
    .order-form .btn[disabled] {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .order-form__actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: var(--space-3);
      margin-top: var(--space-5);
    }
    .order-form__back {
      font-size: var(--fs-sm);
      color: var(--beige-deep);
      border-bottom: 1px solid var(--line);
    }
    .order-form__back:hover {
      color: var(--ink);
      border-color: var(--bronze);
    }
    @media (max-width: 40rem) {
      .order-form .btn {
        width: 100%;
      }
    }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="container site-header__inner">
      <a class="brand" href="index.html">Body Scent</a>
      <nav class="nav" aria-label="เมนูหลัก">
        <a href="index.html">หน้าแรก</a>
        <a href="product.html">สินค้า</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="section">
      <div class="container">
        <div class="section__head">
          <h1>สั่งซื้อสินค้า</h1>
          <hr class="rule">
          <p>กรอกข้อมูลของคุณ แล้วกดยืนยันสั่งซื้อ เราจะติดต่อกลับตามเบอร์โทรหรือ Line ที่ให้ไว้</p>
        </div>

        <form id="orderForm" class="order-form" autocomplete="on">
          <div class="field">
            <label for="customerName">ชื่อลูกค้า <span class="req">*</span></label>
            <input type="text" id="customerName" name="customerName" autocomplete="name" required>
          </div>

          <div class="field">
            <label for="contact">เบอร์โทร / Line <span class="req">*</span></label>
            <input type="text" id="contact" name="contact" autocomplete="tel" required>
          </div>

          <div class="field">
            <label for="items">รายการสินค้า <span class="req">*</span></label>
            <textarea id="items" name="items" rows="2" required></textarea>
            <p class="field__hint">เติมให้อัตโนมัติจากสินค้าที่เลือก แก้ไขหรือเพิ่มรายการได้</p>
          </div>

          <div class="field">
            <label for="total">จำนวนเงินรวม (บาท) <span class="req">*</span></label>
            <input type="number" id="total" name="total" min="0" step="any" inputmode="decimal" required>
          </div>

          <div class="field">
            <label for="note">หมายเหตุ</label>
            <textarea id="note" name="note" rows="3"></textarea>
          </div>

          <div class="order-form__actions">
            <button type="submit" class="btn btn--accent">ยืนยันสั่งซื้อ</button>
            <a class="order-form__back" href="product.html">กลับไปเลือกสินค้า</a>
          </div>
        </form>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container site-footer__inner">
      <span class="brand">Body Scent</span>
      <span>&copy; 2026 Body Scent</span>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
